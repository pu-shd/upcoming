# The source registry.
#
# Every feed in scope appears here, including the ones that do not work yet -- a gap
# recorded as config is reviewable, and enabling a source becomes a one-line change with a
# test rather than an archaeology project.
#
# Field semantics are declared per source and have NO default. On these feeds SUMMARY
# carries the speaker on some sites and the talk title on others; both satisfy the same
# schema, so a wrong mapping produces valid, error-free output with the two fields
# transposed and nothing anywhere reports a problem. `expectations.summary_role` is the
# human's statement of that fact, and the loader refuses a source without it.
#
# All counts and shapes in the comments below were measured on 2026-09-11, not assumed.

# What the events from a feed may be put toward. A declared vocabulary, because a purpose
# is matched by name: a misspelled one would select nothing and report success, which is
# indistinguishable from a filter that is simply strict.
#
# A feed names the purposes it serves and every event inherits them, with an optional
# per-event override below. Nothing is inherited from `defaults:` -- a feed added for some
# other reason serves no purpose until it says so, because a source silently joining a
# publication is a worse failure than one left out and noticed.
purposes:
  engineering-newsletter:
    label: Engineering events newsletter

defaults:
  platform: princeton-site-builder
  url_template: "https://{host}/feeds/events/ical.ics"
  timezone: America/New_York
  status: live
  cadence: 1h
  rebuild_after_hours: 24
  # `delta:N` is the recurrence index, not a constant. citp publishes one weekly reading
  # group as ps_events:5261:delta:0 through :delta:10 -- eleven instances of one recurring
  # event, each with its own DTSTART. The full UID therefore identifies one *occurrence*,
  # which is what a feed of events wants. Discovered by the uid_pattern gate, which was
  # written against `delta:0` examples alone.
  uid_pattern: '^ps_events:\d+:delta:\d+$'

  http:
    timeout:
      connect: 5
      read: 15
    retries: 2
    # 403 is deliberately absent: on these hosts it is a bot challenge, not a transient
    # fault, so retrying burns the budget while the actual fix is a credential.
    retry_on: [429, 500, 502, 503, 504]
    headers:
      User-Agent: "pu-shd-upcoming/0.1 (+https://github.com/pu-shd/upcoming)"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"

    # Each named secret holds a WHOLE header line, "Name: value". The header name is not
    # written here either, because it is a detail of someone else's bot-protection
    # arrangement -- and a config file naming it invites the next reader to hardcode a
    # plausible value beside it, which is exactly how the predecessors ended up sending
    # "1" and 403ing on every page.
    #
    # Load-bearing on every Site Builder host, not just one: measured, every event page
    # returns 403 to every client without this header, while every ICS endpoint answers a
    # bare request. So an absent credential degrades enrichment ONLY -- the feed still
    # publishes, green, with nothing scraped. There is no default: the loader fails for
    # any source with enrichment enabled when the secret is unset.
    #
    # Measured 2026-09-11: the hosts check the header's PRESENCE with a non-empty value,
    # not its contents -- "true", "wrong-value" and "0" all return 200, while an empty
    # value or no header at all returns 403. So the realistic failure is the header going
    # missing or being renamed, which the loader refuses outright; the enrichment
    # success-rate gate is what catches it if a host starts validating the value, or if
    # the header name changes upstream.
    secret_headers: [BOT_BYPASS_HEADER]

  # Ordered chain. Order is load-bearing: `detail_dash_name` must precede the room-token
  # rules, or "125 - Sherrerd Hall" mis-splits. Each rule declines rather than guessing,
  # and `whole` puts an unsplittable venue in `name` entire.
  location_rules: [sentinel, detail_dash_name, comma_room, parenthetical, slash_room, unambiguous_room, whole]

  # Enrichment defaults. Opt-in still: a source that wants none sets `enrich: []`.
  #
  # Only the raw-details container is harmonized, because it is the one selector whose
  # meaning is the same everywhere -- measured, present on all 11 live hosts. Anything
  # reading a *semantic* field stays per source, because `div.event-subtitle` carries the
  # talk title on orfe, the speaker on mae and the host on materials. A source overriding
  # `enrich` replaces this list wholesale rather than appending, exactly as with rule
  # chains and for the same reason: order is priority order.
  enrich:
    - field: raw_details
      selectors: ["div.events-detail-main", "div.event-details-main"]

  # How a title is synthesized when the feed carries none. Harmonized here so the shape is
  # consistent across departments; a source needing different wording overrides it.
  # {a_an} picks the article by sound -- "an S. S. Wilks seminar", "a university seminar".
  fallback:
    title_template: "{a_an} {series} Talk by"

  expectations:
    min_events: 1
    allow_empty: false
    min_enrich_success_rate: 0.8
    max_location_declined_rate: 0.3

sources:
  # ---------------------------------------------------------------------------------
  # Live Princeton Site Builder feeds
  # ---------------------------------------------------------------------------------

  - slug: orfe
    label: Operations Research and Financial Engineering
    purposes: [engineering-newsletter]
    host: orfe.princeton.edu
    cadence: 30m
    rebuild_after_hours: 6
    # SUMMARY is the speaker ("FPO\, Aaradhya Pandey"); the talk title lives on the event
    # page. The exact inverse of mae, and the pair that proves the registry works.
    location_rules: [sentinel, detail_dash_name, unambiguous_room, whole]
    # ORFE does not list final public orals on its upcoming-events display, so this feed
    # does not carry them. Matching the canonical `fpo` tag rather than the literal series
    # string "FPO": the tag is what the vocabulary normalizes every department's spelling
    # to, so this keeps working if ORFE renames the series -- which it has already done
    # once, to a seminar series, and that rename silently dropped four events from a
    # filtered feed until the unmapped-tags gate caught it.
    #
    # The count declined is published in status.json. A filtered feed and a feed whose
    # upstream went quiet look identical from outside, and only one of them is a choice.
    publish_unless:
      tags:
        contains: fpo
    # Per field, not one boolean per source. ORFE's downstream ingest expects
    # "Elynn Chen\, New York University" with the comma escaped. The predecessor has a
    # single `escape_name_commas` governing whatever SUMMARY maps to, which is the speaker
    # here and the title on MAE -- where it mangles "Winds\, Waves\, and Wakes". One
    # boolean, two incompatible right answers.
    wire:
      escape: [speaker, speakers, content]
    # No ORFE event carries a title: its SUMMARY is the speaker, so every event is
    # synthesized from the inherited template and published with
    # titleSource/titleIsPlaceholder so a consumer can tell.
    # Restates the inherited raw-details target because a source's list replaces rather
    # than extends. Verified on the real pages: the subtitle here is the talk title.
    enrich:
      - field: title
        selectors: ["div.event-subtitle"]
        mode: fill
        provenance: enriched
      - field: raw_details
        selectors: ["div.events-detail-main", "div.event-details-main"]
    expectations:
      summary_role: speaker
      min_events: 5
      require_nonempty: [speaker]
      # Every one of its 23 events needs a synthesized title, since the feed carries none.
      max_placeholder_title_rate: 1.0

  - slug: citp
    label: Center for Information Technology Policy
    purposes: [engineering-newsletter]
    host: citp.princeton.edu
    cadence: 30m
    rebuild_after_hours: 6
    # Composite: "Arvind Narayanan - AI Agents and the Augmentation Agenda".
    location_rules: [sentinel, unambiguous_room, whole]
    # 6 events are "speaker - title", 5 are a bare speaker name, 13 are a plain title.
    # The bare-name rule is the one judgement call: "Andy Guess" and "Bias in AI Reading
    # Group" are both title-case word sequences, separated only by the not_a_person
    # vocabulary in patterns.yaml.
    summary:
      on_no_match: fail
      rules:
        - id: speaker-dash-title
          when: { matches: person_dash_title }
          then:
            capture: { speakers: person, title: title }
        - id: bare-person-name
          when: { predicate: person_name_shape }
          then:
            assign: { speakers: summary }
            defer: [title]
        - id: title
          when: { always: true }
          then: { assign: { title: summary } }
    expectations:
      summary_role: rules
      min_events: 5
      max_placeholder_title_rate: 0.5

  - slug: quantum
    label: Princeton Quantum Initiative
    purposes: [engineering-newsletter]
    host: quantum.princeton.edu
    # Two composite shapes:
    #   'Quantum Group Meeting: "…title…" - Sid Midha (Gopalakrishnan Group)'
    #   'Princeton Quantum Colloquium: TBD\, Francesca Ferlaino (University of Innsbruck)'
    # 14 of 18 events carry a TBD title -- series and speaker known, title genuinely
    # unset. That is normal here, so the placeholder band is wide on purpose; what should
    # alert is a change in the rate, not the rate itself.
    location_rules: [sentinel, unambiguous_room, whole]
    # SUMMARY packs series, title, speaker and affiliation into one string, in three
    # shapes. Order matters: the quoted-title pattern must precede the unquoted one, or
    # the unquoted pattern matches a quoted string and keeps the quote marks in the title.
    #
    # A captured "TBD" title is absence, not a title -- provenance.is_missing treats it so,
    # and the fallback chain synthesizes one and flags it. 14 of 18 events are in that
    # state, which is why the placeholder band below is wide.
    summary:
      on_no_match: fail
      rules:
        - id: series-quoted-title-dash-person
          when: { matches: series_quoted_title_dash_person_paren }
          then:
            capture:
              series_extra: series
              title: title
              speakers: person
              affiliation: paren
        - id: series-title-dash-person
          when: { matches: series_title_dash_person_paren }
          then:
            capture:
              series_extra: series
              title: title
              speakers: person
              affiliation: paren
        - id: series-title-comma-person
          when: { matches: series_title_comma_person_paren }
          then:
            capture:
              series_extra: series
              title: title
              speakers: person
              affiliation: paren
        # "Princeton Quantum Technology Conference 2026" -- no colon, so a plain title.
        - id: title
          when: { always: true }
          then: { assign: { title: summary } }
    expectations:
      summary_role: rules
      max_placeholder_title_rate: 0.95

  - slug: materials
    label: Princeton Materials Institute
    purposes: [engineering-newsletter]
    host: materials.princeton.edu
    # "PMI/PCCM SEMINAR SERIES Fall 2026: Sean Roberts\, University of Texas at Austin"
    # Also carries "Briger Hall (C112 + Atrium C102)", hence the parenthetical rule, and
    # two events with no LOCATION property at all.
    location_rules: [sentinel, parenthetical, unambiguous_room, whole]
    # The subtitle here reads "Hosted by Alice Kunin" -- a real person, correctly scraped,
    # and the wrong one. Scraping it into `speakers` would publish the host as the speaker:
    # schema-valid and false. The reject pattern declines it and the decline is counted, so
    # a selector that always rejects shows up instead of quietly yielding nothing.
    enrich:
      - field: speakers
        selectors: ["div.event-subtitle"]
        # Matched case-insensitively; the capitalisation is the publisher's, not a rule.
        reject:
          - '^hosted by\b'
          - '^organi[sz]ed by\b'
          - '^moderated by\b'
        split_affiliation: true
      - field: raw_details
        selectors: ["div.events-detail-main", "div.event-details-main"]
    # 12 of 16 are "PMI/PCCM SEMINAR SERIES Fall 2026: Sean Roberts, University of Texas
    # at Austin" -- the series and the speaker, with no title anywhere in the feed. The
    # other 4 are plain titles for symposia.
    summary:
      on_no_match: fail
      rules:
        - id: series-person-affiliation
          when: { matches: series_person_comma_affiliation }
          then:
            capture:
              series_extra: series
              speakers: person
              affiliation: paren
            defer: [title]
        - id: title
          when: { always: true }
          then: { assign: { title: summary } }
    expectations:
      summary_role: rules
      max_location_declined_rate: 0.4
      max_placeholder_title_rate: 0.85

  - slug: ece
    label: Electrical and Computer Engineering
    purposes: [engineering-newsletter]
    host: ece.princeton.edu
    # Not in the original host list: discovered because nextg.princeton.edu has no feed of
    # its own and its events page links here.
    location_rules: [sentinel, unambiguous_room, whole]
    expectations:
      summary_role: title
      max_placeholder_title_rate: 0.2

  - slug: cbe
    label: Chemical and Biological Engineering
    purposes: [engineering-newsletter]
    host: cbe.princeton.edu
    # Writes BOTH "E105 SEAS-BioE" (room first) and "SEAS-CBE F212" (building first) in one
    # feed, which is why the room rule splits only when exactly one end looks like a room
    # and declines otherwise.
    location_rules: [sentinel, unambiguous_room, whole]
    expectations:
      summary_role: title
      max_placeholder_title_rate: 0.2

  - slug: mae
    label: Mechanical and Aerospace Engineering
    purposes: [engineering-newsletter]
    host: mae.princeton.edu
    # SUMMARY is the talk title and the event page carries the speaker -- the inverse of
    # orfe. One event's entire SUMMARY is the literal string "TBD" and one has
    # LOCATION:TBD, so sentinel detection is exercised from the first source built.
    location_rules: [sentinel, slash_room, unambiguous_room, whole]
    # Two selectors because MAE's own pages differ: FPO pages carry the speaker field with
    # a bare name ("Jun Eshima"), seminar pages carry the subtitle with name and
    # affiliation ("Dr. Rebecca Ciez, Purdue University"). Tried in that order.
    enrich:
      - field: speakers
        selectors:
          - "div.field--name-field-ps-event-speaker-name"
          - "div.event-subtitle"
        mode: fill
        split_affiliation: true
        # No provenance: this targets the speaker, and claiming the title was "enriched"
        # because a speaker was scraped would report a still-unknown title as real.
      - field: raw_details
        selectors: ["div.events-detail-main", "div.event-details-main"]
    expectations:
      summary_role: title
      require_nonempty: [title]

  - slug: ai
    label: Princeton AI Lab
    purposes: [engineering-newsletter]
    host: ai.princeton.edu
    # MIXED WITHIN ONE FEED -- the case a single per-source mapping cannot express:
    #   "Rafael Gomez-Bombarelli"                                    -> a speaker
    #   "Whose AI for Amazon Forests? Technological Sovereignty…"    -> a title
    #   "ORFE Talks & Seminars Flyers Fall 2026 Colloquium"          -> a series listing
    # Also carries all three location conventions: "Bowen Hall 222",
    # "Aaron Burr Hall\, Room 216", "101 Sherrerd Hall".
    location_rules: [sentinel, comma_room, unambiguous_room, whole]
    # Three meanings in one feed, so the mapping is declared rather than implied.
    # The listing rule comes first: "ORFE Talks & Seminars Flyers Fall 2026 Colloquium"
    # names a listing page, not a talk, and would otherwise be published as a title.
    summary:
      on_no_match: fail
      rules:
        # "ORFE Talks & Seminars Flyers Fall 2026 Colloquium" names a listing page rather
        # than one talk. It is still what the department published as this event's name, so
        # it becomes the title -- deferring instead yields "A Talk", which is worse than
        # the publisher's own words. The tag lets a consumer filter these out.
        - id: series-listing
          when: { matches: series_listing }
          then:
            capture: { title: listing }
            tag: [listing]
            defer: [speakers]
        - id: bare-person-name
          when: { predicate: person_name_shape }
          then:
            assign: { speakers: summary }
            defer: [title]
        - id: title
          when: { always: true }
          then: { assign: { title: summary } }
    expectations:
      summary_role: rules
      max_placeholder_title_rate: 0.9

  - slug: bioengineering
    label: Omenn-Darling Bioengineering Institute
    purposes: [engineering-newsletter]
    host: bioengineering.princeton.edu
    # The Rising Stars symposium page lists four speakers (Jacqueline Bliley, André
    # Forjaz, Helena Hu, Felix Radford). The model carries `speakers[]`, so all four
    # survive; a scalar field would have published one and dropped three silently.
    location_rules: [sentinel, comma_room, unambiguous_room, whole]
    enrich:
      - field: speakers
        selectors: ["div.field--name-field-ps-event-speaker-name"]
        mode: fill
        # No provenance: this targets speakers, not the title.
      - field: raw_details
        selectors: ["div.events-detail-main", "div.event-details-main"]
    expectations:
      summary_role: title
      min_events: 1

  - slug: cee
    label: Civil and Environmental Engineering
    purposes: [engineering-newsletter]
    host: cee.princeton.edu
    cadence: 6h
    # Legitimately tiny: 1 event. A relative count floor would read that as a collapse, so
    # the floor stays absolute here.
    location_rules: [sentinel, unambiguous_room, whole]
    expectations:
      summary_role: title
      min_events: 1

  - slug: robotics
    label: Princeton Robotics
    purposes: [engineering-newsletter]
    host: robotics.princeton.edu
    cadence: 6h
    # 1 event, and "Commons" has no room component -- the location chain must decline
    # rather than invent a split.
    location_rules: [sentinel, unambiguous_room, whole]
    expectations:
      summary_role: title
      min_events: 1

  # ---------------------------------------------------------------------------------
  # Live, but a different platform
  # ---------------------------------------------------------------------------------

  - slug: kellercenter
    label: Keller Center for Innovation in Engineering Education
    purposes: [engineering-newsletter]
    host: kellercenter.princeton.edu
    platform: drupal-ical-api
    feed_url: "https://kellercenter.princeton.edu/events.ics"
    cadence: 6h
    # PRODID:-//Drupal iCal API//EN, NOT Site Builder, from a URL that looks conventional.
    # Currently a well-formed VCALENDAR with zero VEVENTs. `allow_empty` is what separates
    # "valid and empty" from "broken": the two payloads are identical and only this
    # declaration knows which is which. A min_events floor here would leave the source
    # permanently red, which teaches everyone to ignore the alerts.
    #
    # uid_pattern is explicitly unset rather than inheriting Site Builder's: this
    # platform's UID scheme is unknown, and a UID that fails a declared pattern should
    # surface as an anomaly instead of being assumed to fit.
    uid_pattern: null
    location_rules: [sentinel, comma_room, unambiguous_room, whole]
    expectations:
      summary_role: title
      min_events: 0
      allow_empty: true

  # ---------------------------------------------------------------------------------
  # No machine-readable feed. Declared so the gap is visible and the investigation is
  # recorded; never fetched, never published.
  # ---------------------------------------------------------------------------------

  - slug: nextg
    label: NextG Initiative
    purposes: [engineering-newsletter]
    host: nextg.princeton.edu
    status: unavailable
    reason: >
      No feed of its own; its events page links to ece.princeton.edu, so it is correctly a
      derived view rather than a second fetch. But ece's feed carries exactly one
      CATEGORIES value across all 12 events -- "Final Public Oral Examinations,Final Public
      Orals" on 7, and no CATEGORIES at all on the other 5 -- so there is no NextG
      discriminator in the data to filter on. Enable as a combo over ece once ECE tags
      NextG events, or once NextG supplies a curated list. A guessed predicate here would
      be the config-layer version of the mapping bug this project exists to prevent.

  - slug: cs
    label: Computer Science
    purposes: [engineering-newsletter]
    host: www.cs.princeton.edu
    status: unavailable
    reason: >
      Drupal, but not Princeton Site Builder and with no iCal view enabled. Checked the
      bare apex too: cs.princeton.edu 301s to www.cs.princeton.edu, so it is the same host
      rather than a second one. /feeds/events/ical.ics, /events/ical, /ical,
      /calendar/ical and /events/export/ical all 404 on both spellings, and /events
      carries no ics, ical or webcal link. Needs an iCal view upstream, or an
      HTML-listing adapter.

  - slug: acee
    label: Andlinger Center for Energy and the Environment
    purposes: [engineering-newsletter]
    host: acee.princeton.edu
    status: unavailable
    reason: >
      WordPress 7.1. REST exposes an `events` post type but its ACF fields are empty to an
      unauthenticated client, so no start or end time is available. /events/feed/ 404s and
      /events/?ical=1 returns HTML. Needs an ICS export plugin, or ACF date fields exposed
      to REST.

  - slug: decenter
    label: DeCenter for Decentralization
    purposes: [engineering-newsletter]
    host: decenter.princeton.edu
    status: unavailable
    reason: >
      WordPress 7.1. REST exposes `conference` and `eng_event` post types; `eng_event`
      carries an `acf` object that is empty unauthenticated, so no event dates are
      available. /events/feed/ 404s and /events/?ical=1 returns HTML.

  - slug: metro
    label: Metropolis Project
    purposes: [engineering-newsletter]
    host: metro.princeton.edu
    status: unavailable
    reason: >
      WordPress 7.1. /events/feed/ does return RSS with 10 items, but its pubDate is the
      post publication date rather than the event date, so it cannot produce a calendar.
      REST exposes a `metroevents` type (rest_base `event`) whose ACF fields are empty
      unauthenticated.
