[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pu-shd-upcoming"
version = "0.1.0"
description = "Multi-source campus event feeds: one events.json per source, plus composable combined feeds."
requires-python = ">=3.12"
license = { text = "MIT" }
# Every entry here is imported somewhere. Four were not and are gone: `ics`, whose
# Calendar this package deliberately does not use because its `events` is a set and loses
# feed order; `tatsu` and `arrow`, which only existed to satisfy `ics`; and `markdownify`,
# inherited from the predecessor and never called. The `tatsu>=4.2,<5.16` ceiling went with
# them -- an upper bound carried for a library we do not import is a future upgrade blocked
# for no reason.
dependencies = [
  "requests",
  "beautifulsoup4",
  "soupsieve",         # scrape.py catches SelectorSyntaxError from it by name
  "jsonschema>=4.18",
  "referencing",       # arrives via jsonschema >=4.18, but validate.py imports it directly
  "PyYAML",            # the registry, tags and combos are YAML; contract tests parse CI YAML
  # zoneinfo fallback: Windows ships no IANA tz database and slim base images may drop theirs.
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-requests", "types-PyYAML", "types-jsonschema"]

[project.scripts]
upcoming = "upcoming.cli:main"

[tool.setuptools.packages.find]
include = ["upcoming*"]

[tool.pytest.ini_options]
# Explicit pythonpath: adding pyproject.toml changes pytest's rootdir resolution, and
# without this the package imports break all at once.
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

# Strict over the modules carrying the operational invariants. The BeautifulSoup and `ics`
# surfaces stay at default: making them strict-clean is a week of `# type: ignore` for no
# real safety, while these modules are where a type error becomes wrong published data.
[[tool.mypy.overrides]]
module = ["upcoming.model", "upcoming.registry", "upcoming.errors"]
strict = true

[[tool.mypy.overrides]]
module = ["ics.*", "bs4.*", "markdownify.*", "arrow.*"]
ignore_missing_imports = true
